name: build-release

# ============================================================================
# 装甲元帅2 汉化补丁：编译 -> 打包 -> 校验 -> Artifact ->（可选）Release
# ----------------------------------------------------------------------------
# 产物：build_out/PanzerGeneral2-CHS-<date>-<time>.zip
#       解压到游戏根目录即可用；包内 update/ 为 GOG 快捷方式指定的工作目录。
#
# 触发：
#   push(master / dev)     自动构建 + 校验 + 上传 Artifact
#   pull_request(master)   门禁（只构建，不发布）
#   workflow_dispatch      手动；可勾选 publish 顺带发 Release、skip_dll 只打包文本
#
# ★ 架构：windows-latest + MSVC x86（VS2022 v143 的 Hostx64/x86 交叉工具）。
#   本机开发用 VS2017 v141，但本 DLL 是普通 Win32 C++（无 vcxproj / 无第三方 lib），
#   用 CI 现成的 MSVC x86 直接 cl 编译即可，不需要在 runner 上加装 v141，
#   也不需要旧方案「ubuntu + msvc-wine 下载 4GB 工具链」的 30 分钟冷启动。
#   DLL 仍是 PE32（32 位），由 verify_release.py 硬校验。
#
#   ilammy/msvc-dev-cmd 把 cl / INCLUDE / LIB 写进 GITHUB_ENV，后续步骤都继承。
#   build_dll_local.py 在 cl 位于 PATH 时直接沿用这些环境变量，不覆盖。
# ============================================================================

on:
  push:
    branches: [master, dev]
    # 纯文档改动不消耗 runner
    paths-ignore:
      - '**.md'
      - 'Documents/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'Documents/**'
  workflow_dispatch:
    inputs:
      publish:
        description: '构建完成后同时创建 GitHub Release（默认只上传 Artifact）'
        type: boolean
        default: false
      skip_dll:
        description: '跳过 ASI 编译（只打包文本资源）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 / 打包 / 校验（windows-latest, MSVC x86）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: 初始化 MSVC x86 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: 编译器诊断（cl / Python / 目标架构）
        shell: bash
        run: |
          set -euo pipefail
          cl 2>&1 | head -3 || true
          python -c "import shutil,sys; p=shutil.which('cl') or shutil.which('cl.exe'); print('cl =',p); sys.exit(0 if p else 1)"
          python --version

      - name: 编译 PG2CHS_DLL（Win32 / x86）
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python Tools/ci/build_dll_local.py --clean

      - name: 跳过 ASI 编译
        if: ${{ github.event.inputs.skip_dll == 'true' }}
        shell: bash
        run: echo "workflow_dispatch 勾选了 skip_dll：本次为纯文本构建。"

      - name: 装配发布包 (build_release.py)
        shell: bash
        run: |
          set -euo pipefail
          python Tools/ci/build_release.py --out-root build_out \
            ${{ github.event.inputs.skip_dll == 'true' && '--skip-dll' || '' }}

      - name: 校验发布包 (verify_release.py)
        shell: bash
        run: |
          set -euo pipefail
          args=""
          if [ "${{ github.event.inputs.skip_dll }}" != "true" ]; then
            args="--require-asi"
          fi
          python Tools/ci/verify_release.py build_out $args

      - name: 上传发布包 Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pg2-chs-${{ github.ref_name }}-${{ github.run_number }}
          path: build_out/PanzerGeneral2-CHS-*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 发布 Release（仅手动勾选 publish 时）
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出仓库（取提交记录）
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 下载发布包
        uses: actions/download-artifact@v8.0.2
        with:
          name: pg2-chs-${{ github.ref_name }}-${{ github.run_number }}
          path: dist

      - name: 创建 Release
        shell: bash
        run: |
          set -euo pipefail
          tag="汉化补丁-$(TZ=Asia/Shanghai date +%Y-%m-%d-%H-%M-%S)"
          zip_path="$(find dist -name 'PanzerGeneral2-CHS-*.zip' -print -quit)"
          if [ -z "$zip_path" ]; then
            echo "!! dist 内没有发布包：" >&2
            ls -R dist >&2
            exit 1
          fi
          {
            echo "## 《装甲元帅 2》汉化补丁"
            echo
            echo "由 GitHub Actions 从提交 \`${GITHUB_SHA:0:7}\` 自动构建，下载 zip 后解压覆盖到游戏根目录。"
            echo "安装 / 卸载 / 常见问题见包内 \`必读说明.txt\`。"
            echo
            echo "| 附件 | 说明 |"
            echo "|---|---|"
            echo "| \`$(basename "$zip_path")\` | 简体中文（CHS）汉化包 |"
          } > notes.md
          gh release create "$tag" "$zip_path" \
            --target "$GITHUB_SHA" \
            --title "装甲元帅2 汉化补丁 $tag" \
            --notes-file notes.md
          echo "已发布：$tag"
