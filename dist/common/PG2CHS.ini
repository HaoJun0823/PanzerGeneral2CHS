; ============================================================
;  装甲元帅2 简体中文汉化 —— 运行参数
;  修改后重启游戏生效，无需重新编译
; ============================================================
[PG2CHS]

; 中文字体（按此名优先，找不到自动回退 SimSun / 雅黑 UI / 雅黑）
FontName=SimSun

; 字号(px)。0=自动（游戏自带位图字体只有 8px 高，自动档取 12px）
; 12 = 清晰且基本贴合行距；14/16 更清楚但相邻行会互相压到
FontHeight=12

; 垂直微调（正=下移，负=上移）。字整体偏上就填 1~2 试试
VOffset=0

; 1 = 抗锯齿(灰度+阈值)，大字号更平滑；0 = 点阵(1bpp)，12px 最清晰、最像原版
AntiAlias=0

; 仅 AntiAlias=1 时有效：笔画阈值 0~255，越大字越细（96 适中，64 更粗）
Threshold=96

; 1 = 把诊断信息写入 PG2CHS.log（排查问题时打开）
Debug=1

; 1 = 首次画中文时把整屏 dump 成 PG2CHS_frame.pgm（仅排查用，平时关掉）
DumpFrame=0
; 1 = 首次绘制时跑一遍中文换行自检（仅排查用）
SelfTest=0
; 1 = 还原被游戏按字节切碎的关卡标题（修复乱码/日语/问号/方块/缺字）
RepairFragments=1
; 1 = 显示层把英文地名/装备/姓氏/日期换成中文（数据文件保持英文）
TranslateExtra=1

; 1 = 简报多行文本按游戏行距压高（默认 10px，不压到下一行）
FitGlyphHeight=1
; 简报压高目标(px)：0 = 自动取行距(10)；可填 8~12 微调
GlyphHeight=0

; 1 = 条件背景擦除：画字前把上次写过的旧笔画点填成背景色，
;     只动我们自己写过的像素，底纹/边框/图标零破坏（默认，消除底部叠字）
; 0 = 关闭自擦除（会回到旧字残留）
InkUndo=1
; 1 = 按钮/状态栏/菜单用完整 12px 方字（依赖 InkUndo）
; 0 = 普通文本也压成简报高度（回到扁字）
FullHeightText=1
