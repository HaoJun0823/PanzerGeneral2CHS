; ============================================================
;  装甲元帅2 简体中文汉化 —— 运行参数
;  修改后重启游戏生效，无需重新编译
; ============================================================
[PG2CHS]

; 中文字体（按此名优先，找不到自动回退 SimSun / 雅黑 UI / 雅黑）
FontName=SimSun

; 字号(px)。0=自动（游戏自带位图字体只有 8px 高，自动档取 12px）
; 12 = 清晰且基本贴合行距；14/16 更清楚但相邻行会互相压到
FontHeight=12

; 垂直微调（正=下移，负=上移）。字整体偏上就填 1~2 试试
VOffset=0

; 1 = 抗锯齿(灰度+阈值)，大字号更平滑；0 = 点阵(1bpp)，12px 最清晰、最像原版
AntiAlias=0

; 仅 AntiAlias=1 时有效：笔画阈值 0~255，越大字越细（96 适中，64 更粗）
Threshold=96

; 1 = 把诊断信息写入 PG2CHS.log（排查问题时打开）
Debug=1

; 1 = 首次画中文时把整屏 dump 成 PG2CHS_frame.pgm（仅排查用，平时关掉）
DumpFrame=0
; 1 = 首次绘制时跑一遍中文换行自检（仅排查用）
SelfTest=0
; 1 = 还原被游戏按字节切碎的关卡标题（修复乱码/日语/问号/方块/缺字）
RepairFragments=1
; 1 = 显示层把英文地名/装备/姓氏/日期换成中文（数据文件保持英文）
TranslateExtra=1

; 1 = 把汉字纵向压进游戏 8px 的刷新矩形（默认，字底不会再残留/叠字）
; 0 = 保持完整 12px 字高：字更方，但游戏刷新不到最底下几像素，会有残影
FitGlyphHeight=1
; 压缩目标高度(px)：0 = 自动取游戏自带字形高(实机 8)；可填 8~12 微调
GlyphHeight=0

; 1 = 逐像素恢复上一次写的笔画（DLL 自己擦旧字），底纹完整保留
InkUndo=1
; 1 = 按钮/状态栏/菜单恢复 12px 方字（依赖 InkUndo）；简报多行仍压到 8px 避免行重叠
FullHeightText=1
